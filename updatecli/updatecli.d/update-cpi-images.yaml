{{/* Add new CPI minors to cpi.primeMinors in updatecli/values.yaml. */}}
name: "Update Rancher vSphere CPI prime tags"

sources:
{{- range $minor := .cpi.primeMinors }}
  cpiPrime{{ replace "." "" $minor }}:
    name: Get latest vSphere CPI {{ $minor }} release tag
    kind: githubrelease
    spec:
      owner: rancher
      repository: image-build-cloud-provider-vsphere
      token: '{{ requiredEnv $.github.token }}'
      username: '{{ requiredEnv $.github.username }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: regex
        pattern: '^v{{ $minor }}\.[0-9]+-build[0-9]+$'
{{- end }}

targets:
{{- range $minor := .cpi.primeMinors }}
  cpiPrimeTag{{ replace "." "" $minor }}:
    name: Update CPI cloudControllerManager primeTag for {{ $minor }}
    kind: yaml
    scmid: default
    sourceid: cpiPrime{{ replace "." "" $minor }}
    spec:
      file: charts/rancher-vsphere-cpi/values.yaml
      engine: yamlpath
      key: $.versionOverrides[?(@.constraint == '~ {{ $minor }}')].values.cloudControllerManager.primeTag
{{- end }}

{{- range $minor := .cpi.primeMinors }}
  cpiPrimeTagTestNoRegistry{{ replace "." "" $minor }}:
    name: Update CPI {{ $minor }} prime tag in tests without system default registry
    kind: file
    scmid: default
    sourceid: cpiPrime{{ replace "." "" $minor }}
    spec:
      file: tests/unit/cpi_template_test.go
      matchpattern: 'expectedImage: "rancher/hardened-cloud-provider-vsphere:v{{ $minor }}\.[^"]+"'
      replacepattern: 'expectedImage: "rancher/hardened-cloud-provider-vsphere:{{ source (printf "cpiPrime%s" (replace "." "" $minor)) }}"'

{{- end }}

  cpiPrimeTagTestWithRegistry:
    name: Update CPI 1.36 prime tag in tests with system default registry
    kind: file
    scmid: default
    sourceid: cpiPrime136
    spec:
      file: tests/unit/cpi_template_test.go
      matchpattern: 'expectedImage: "registry.rancher.com/rancher/hardened-cloud-provider-vsphere:v1\.36\.[^"]+"'
      replacepattern: 'expectedImage: "registry.rancher.com/rancher/hardened-cloud-provider-vsphere:{{ source "cpiPrime136" }}"'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      commitusingapi: true

actions:
  default:
    title: '[updatecli] Bump Rancher vSphere CPI Prime image tags'
    kind: github/pullrequest
    scmid: default
    spec:
      merge:
        strategy: manual
      mergemethod: squash
      description: |
        This automated PR updates the Rancher Prime image tag in the vSphere CPI chart.

        Updated sources:
      {{- range $minor := .cpi.primeMinors }}
        - hardened-cloud-provider-vsphere ({{ $minor }}): {{ source (printf "cpiPrime%s" (replace "." "" $minor)) }}
      {{- end }}
