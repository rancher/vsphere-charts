name: "Update Rancher vSphere CSI prime tags"

sources:
  csiDriverPrime:
    name: Get latest hardened vSphere CSI driver tag
    kind: dockerimage
    spec:
      image: '{{ .images.primeRegistryRepo }}/hardened-vsphere-csi-driver'
      tagfilter: '^v{{ source "csiDriverVersion" }}-build[0-9]+$'
      versionfilter:
        kind: semver
        pattern: ">=0.0.0-0"

  # When the public driver version is updated we need to bump the CSI chart version accordingly
  csiDriverVersion:
    name: Extract vSphere CSI driver version from the mirrored driver tag
    kind: yaml
    scmid: default
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      engine: yamlpath
      key: $.versionOverrides[0].values.csiController.image.tag

  csiAttacherVersion:
    name: Extract CSI attacher version from the mirrored driver manifest
    kind: yaml
    scmid: default
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      engine: yamlpath
      key: $.versionOverrides[0].values.csiController.image.csiAttacher.tag

  csiResizerVersion:
    name: Extract CSI resizer version from the mirrored driver manifest
    kind: yaml
    scmid: default
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      engine: yamlpath
      key: $.versionOverrides[0].values.csiController.image.csiResizer.tag

  livenessProbeVersion:
    name: Extract livenessprobe version from the mirrored driver manifest
    kind: yaml
    scmid: default
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      engine: yamlpath
      key: $.versionOverrides[0].values.csiController.image.livenessProbe.tag

  vsphereSyncerVersion:
    name: Extract vSphere CSI syncer version from the mirrored driver manifest
    kind: yaml
    scmid: default
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      engine: yamlpath
      key: $.versionOverrides[0].values.csiController.image.vsphereSyncer.tag

  csiProvisionerVersion:
    name: Extract CSI provisioner version from the mirrored driver manifest
    kind: yaml
    scmid: default
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      engine: yamlpath
      key: $.versionOverrides[0].values.csiController.image.csiProvisioner.tag

  csiSnapshotterVersion:
    name: Extract CSI snapshotter version from the mirrored driver manifest
    kind: yaml
    scmid: default
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      engine: yamlpath
      key: $.versionOverrides[0].values.csiController.image.csiSnapshotter.tag

  nodeDriverRegistrarVersion:
    name: Extract CSI node-driver-registrar version from the mirrored driver manifest
    kind: yaml
    scmid: default
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      engine: yamlpath
      key: $.versionOverrides[0].values.csiNode.image.nodeDriverRegistrar.tag

  # We only need to bump the -rancherX suffix when the primeTags are updated to a newer -buildXXXX version
  csiChartVersion:
    name: Calculate CSI chart version for the Prime tag update
    kind: shell
    scmid: default
    spec:
      command: |
        chart_version="$(awk '/^version:/ { print $2; exit }' charts/rancher-vsphere-csi/Chart.yaml)"
        driver_version='{{ source "csiDriverVersion" }}'
        driver_version="${driver_version#v}"
        chart_driver_version="${chart_version%-rancher*}"
        chart_revision="${chart_version##*-rancher}"
        set -- $(awk '/primeTag:/ { print $2 }' charts/rancher-vsphere-csi/values.yaml)

        case "$chart_version" in
          "$chart_driver_version"-rancher[0-9]*) ;;
          *) echo "unexpected CSI chart version: $chart_version" >&2; exit 1 ;;
        esac

        if [ "$#" -ne 10 ]; then
          echo "expected 10 CSI Prime image tags, found $#" >&2
          exit 1
        fi

        if [ "$1" = '{{ source "csiDriverPrime" }}' ] && \
          [ "$2" = '{{ source "csiAttacherPrime" }}' ] && \
          [ "$3" = '{{ source "csiResizerPrime" }}' ] && \
          [ "$4" = '{{ source "livenessProbePrime" }}' ] && \
          [ "$5" = '{{ source "vsphereSyncerPrime" }}' ] && \
          [ "$6" = '{{ source "csiProvisionerPrime" }}' ] && \
          [ "$7" = '{{ source "csiSnapshotterPrime" }}' ] && \
          [ "$8" = '{{ source "csiDriverPrime" }}' ] && \
          [ "$9" = '{{ source "nodeDriverRegistrarPrime" }}' ] && \
          [ "${10}" = '{{ source "livenessProbePrime" }}' ]; then
          printf '%s\n' "$chart_version"
        elif [ "$chart_driver_version" != "$driver_version" ]; then
          printf '%s-rancher1\n' "$driver_version"
        else
          printf '%s-rancher%s\n' "$driver_version" "$((chart_revision + 1))"
        fi

  csiAttacherPrime:
    name: Get latest hardened CSI attacher tag
    kind: dockerimage
    spec:
      image: '{{ .images.primeRegistryRepo }}/hardened-csi-attacher'
      tagfilter: '^{{ source "csiAttacherVersion" }}-build[0-9]+$'
      versionfilter:
        kind: semver
        pattern: ">=0.0.0-0"

  csiResizerPrime:
    name: Get latest hardened CSI resizer tag
    kind: dockerimage
    spec:
      image: '{{ .images.primeRegistryRepo }}/hardened-csi-resizer'
      tagfilter: '^{{ source "csiResizerVersion" }}-build[0-9]+$'
      versionfilter:
        kind: semver
        pattern: ">=0.0.0-0"

  livenessProbePrime:
    name: Get latest hardened livenessprobe tag
    kind: dockerimage
    spec:
      image: '{{ .images.primeRegistryRepo }}/hardened-livenessprobe'
      tagfilter: '^{{ source "livenessProbeVersion" }}-build[0-9]+$'
      versionfilter:
        kind: semver
        pattern: ">=0.0.0-0"

  vsphereSyncerPrime:
    name: Get latest hardened vSphere CSI syncer tag
    kind: dockerimage
    spec:
      image: '{{ .images.primeRegistryRepo }}/hardened-vsphere-csi-syncer'
      tagfilter: '^{{ source "vsphereSyncerVersion" }}-build[0-9]+$'
      versionfilter:
        kind: semver
        pattern: ">=0.0.0-0"

  csiProvisionerPrime:
    name: Get latest hardened CSI provisioner tag
    kind: dockerimage
    spec:
      image: '{{ .images.primeRegistryRepo }}/hardened-csi-provisioner'
      tagfilter: '^{{ source "csiProvisionerVersion" }}-build[0-9]+$'
      versionfilter:
        kind: semver
        # Pin to the v4.x.x line to match the node-driver-registrar version
        # pinned by the vSphere CSI driver manifest. The hardened repo also
        # publishes a newer v6. line, so an unconstrained ">=0.0.0-0" filter
        # drifts prime ahead of mirrored.
        pattern: '>=4.0.0-0 <4.99.0-0'

  csiSnapshotterPrime:
    name: Get latest hardened CSI snapshotter tag
    kind: dockerimage
    spec:
      image: '{{ .images.primeRegistryRepo }}/hardened-csi-snapshotter'
      tagfilter: '^{{ source "csiSnapshotterVersion" }}-build[0-9]+$'
      versionfilter:
        kind: semver
        pattern: ">=0.0.0-0"

  nodeDriverRegistrarPrime:
    name: Get latest hardened CSI node-driver-registrar tag
    kind: dockerimage
    spec:
      image: '{{ .images.primeRegistryRepo }}/hardened-csi-node-driver-registrar'
      tagfilter: '^{{ source "nodeDriverRegistrarVersion" }}-build[0-9]+$'
      versionfilter:
        kind: semver
        pattern: ">=0.0.0-0"

targets:
  csiAppVersion:
    name: Update CSI appVersion for a driver version update
    kind: yaml
    scmid: default
    sourceid: csiDriverVersion
    spec:
      file: charts/rancher-vsphere-csi/Chart.yaml
      key: appVersion
      value: '{{ trimPrefix "v" (source "csiDriverVersion") }}'

  csiChartVersion:
    name: Update CSI chart version for Prime image changes
    kind: yaml
    scmid: default
    sourceid: csiChartVersion
    spec:
      file: charts/rancher-vsphere-csi/Chart.yaml
      key: version

  csiDriverPrimeTag:
    name: Update CSI driver primeTag values
    kind: yaml
    scmid: default
    sourceid: csiDriverPrime
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      keys:
        - csiController.image.primeTag
        - csiNode.image.primeTag

  vsphereSyncerPrimeTag:
    name: Update vSphere syncer primeTag
    kind: yaml
    scmid: default
    sourceid: vsphereSyncerPrime
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      key: csiController.image.vsphereSyncer.primeTag

  csiAttacherPrimeTag:
    name: Update CSI attacher primeTag
    kind: yaml
    scmid: default
    sourceid: csiAttacherPrime
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      key: csiController.image.csiAttacher.primeTag

  csiResizerPrimeTag:
    name: Update CSI resizer primeTag
    kind: yaml
    scmid: default
    sourceid: csiResizerPrime
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      key: csiController.image.csiResizer.primeTag

  livenessProbePrimeTag:
    name: Update liveness probe primeTag values
    kind: yaml
    scmid: default
    sourceid: livenessProbePrime
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      keys:
        - csiController.image.livenessProbe.primeTag
        - csiNode.image.livenessProbe.primeTag

  csiProvisionerPrimeTag:
    name: Update CSI provisioner primeTag
    kind: yaml
    scmid: default
    sourceid: csiProvisionerPrime
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      key: csiController.image.csiProvisioner.primeTag

  csiSnapshotterPrimeTag:
    name: Update CSI snapshotter primeTag
    kind: yaml
    scmid: default
    sourceid: csiSnapshotterPrime
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      key: csiController.image.csiSnapshotter.primeTag

  nodeDriverRegistrarPrimeTag:
    name: Update node-driver-registrar primeTag
    kind: yaml
    scmid: default
    sourceid: nodeDriverRegistrarPrime
    spec:
      file: charts/rancher-vsphere-csi/values.yaml
      key: csiNode.image.nodeDriverRegistrar.primeTag

  csiNodeDriverRegistrarPrimeTagTest:
    name: Update CSI node-driver-registrar prime tags in tests
    kind: file
    scmid: default
    sourceid: nodeDriverRegistrarPrime
    spec:
      file: tests/unit/csi_template_test.go
      matchpattern: 'registry.rancher.com/rancher/hardened-csi-node-driver-registrar:[^"]+'
      replacepattern: 'registry.rancher.com/rancher/hardened-csi-node-driver-registrar:{{ source "nodeDriverRegistrarPrime" }}'

  csiDriverPrimeTagTest:
    name: Update CSI driver prime tags in tests
    kind: file
    scmid: default
    sourceid: csiDriverPrime
    spec:
      file: tests/unit/csi_template_test.go
      matchpattern: 'registry.rancher.com/rancher/hardened-vsphere-csi-driver:[^"]+'
      replacepattern: 'registry.rancher.com/rancher/hardened-vsphere-csi-driver:{{ source "csiDriverPrime" }}'

  csiLivenessProbePrimeTagTest:
    name: Update CSI livenessprobe prime tags in tests
    kind: file
    scmid: default
    sourceid: livenessProbePrime
    spec:
      file: tests/unit/csi_template_test.go
      matchpattern: 'registry.rancher.com/rancher/hardened-livenessprobe:[^"]+'
      replacepattern: 'registry.rancher.com/rancher/hardened-livenessprobe:{{ source "livenessProbePrime" }}'

  csiAttacherPrimeTagTest:
    name: Update CSI attacher prime tags in tests
    kind: file
    scmid: default
    sourceid: csiAttacherPrime
    spec:
      file: tests/unit/csi_template_test.go
      matchpattern: 'registry.rancher.com/rancher/hardened-csi-attacher:[^"]+'
      replacepattern: 'registry.rancher.com/rancher/hardened-csi-attacher:{{ source "csiAttacherPrime" }}'

  csiSyncerPrimeTagTest:
    name: Update CSI syncer prime tags in tests
    kind: file
    scmid: default
    sourceid: vsphereSyncerPrime
    spec:
      file: tests/unit/csi_template_test.go
      matchpattern: 'registry.rancher.com/rancher/hardened-vsphere-csi-syncer:[^"]+'
      replacepattern: 'registry.rancher.com/rancher/hardened-vsphere-csi-syncer:{{ source "vsphereSyncerPrime" }}'

  csiProvisionerPrimeTagTest:
    name: Update CSI provisioner prime tags in tests
    kind: file
    scmid: default
    sourceid: csiProvisionerPrime
    spec:
      file: tests/unit/csi_template_test.go
      matchpattern: 'registry.rancher.com/rancher/hardened-csi-provisioner:[^"]+'
      replacepattern: 'registry.rancher.com/rancher/hardened-csi-provisioner:{{ source "csiProvisionerPrime" }}'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      commitusingapi: true

actions:
  default:
    title: '[updatecli] Bump Rancher vSphere CSI Prime image tags'
    kind: github/pullrequest
    scmid: default
    spec:
      automerge: false
      mergemethod: squash
      description: |
        This automated PR updates Rancher Prime image tags in the vSphere CSI chart.

        Updated sources:
        - hardened-vsphere-csi-driver: {{ source "csiDriverPrime" }}
        - rancher-vsphere-csi chart version: {{ source "csiChartVersion" }}
        - hardened-csi-attacher: {{ source "csiAttacherPrime" }}
        - hardened-csi-resizer: {{ source "csiResizerPrime" }}
        - hardened-livenessprobe: {{ source "livenessProbePrime" }}
        - hardened-vsphere-csi-syncer: {{ source "vsphereSyncerPrime" }}
        - hardened-csi-provisioner: {{ source "csiProvisionerPrime" }}
        - hardened-csi-snapshotter: {{ source "csiSnapshotterPrime" }}
        - hardened-csi-node-driver-registrar: {{ source "nodeDriverRegistrarPrime" }}
